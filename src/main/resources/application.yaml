spring:
  application:
    name: url-shortener-service

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway manages schema, not Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    root: INFO
    com.huzaifa.url-shortener-service: DEBUG
    org.flywaydb: DEBUG                # see Flyway migrations in logs